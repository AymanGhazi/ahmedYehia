<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141414" />
    <title>Ahmed Yahia Rashid — Architect, finishing &amp; site supervision</title>
    <meta
      name="description"
      content="Ahmed Yahia Rashid, architect. Eight years of residential and public project finishing — site supervision, technical office and handover for SODIC, Palm Hills, Mountain View and Hyde Park. Open to work abroad."
    />
    <meta name="author" content="Ahmed Yahia Rashid" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ahmed Yahia Rashid — Architect" />
    <meta
      property="og:description"
      content="Residential and public project finishing. Site supervision, technical office, handover. Open to work abroad."
    />
    <meta property="og:image" content="/media/hero.jpg" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- The hero image is on the home route only, but this shell is served for
         every URL — a static preload would pull 347 KB on /work, /contact and
         every project page and never use it. Deciding here, during head parse,
         keeps the head start on / and drops the fetch everywhere else. -->
    <script>
      if (location.pathname === "/" || location.pathname === "/index.html") {
        var heroPreload = document.createElement("link");
        heroPreload.rel = "preload";
        heroPreload.as = "image";
        heroPreload.href = "/media/hero.jpg";
        heroPreload.fetchPriority = "high";
        document.head.appendChild(heroPreload);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
